<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REACTOR://TODOS_v3.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #000;
            min-height: 100vh;
            color: #00ffcc;
            overflow-x: hidden;
        }
        
        /* Animated cyber background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at top, #1a0033 0%, #000 50%),
                linear-gradient(180deg, transparent 0%, rgba(255, 0, 128, 0.1) 100%);
            z-index: -2;
        }
        
        /* Scanlines */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 255, 0.03) 0px,
                transparent 1px,
                transparent 2px,
                rgba(0, 255, 255, 0.03) 3px
            );
            pointer-events: none;
            animation: scanlines 8s linear infinite;
            z-index: 1;
        }
        
        @keyframes scanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }
        
        .todoapp {
            background: rgba(10, 10, 30, 0.95);
            margin: 40px auto;
            max-width: 650px;
            border: 2px solid #ff0080;
            box-shadow: 0 0 50px rgba(255, 0, 128, 0.5);
            position: relative;
            z-index: 2;
        }
        
        .header {
            position: relative;
            background: linear-gradient(90deg, rgba(255, 0, 128, 0.2) 0%, rgba(0, 255, 204, 0.2) 100%);
            border-bottom: 2px solid #ff0080;
        }
        
        .header h1 {
            font-family: 'Orbitron', monospace;
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            padding: 20px 0;
            background: linear-gradient(90deg, #ff0080, #00ffcc, #ff0080);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-flow 3s linear infinite;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        
        .new-todo {
            width: 100%;
            font-size: 24px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 300;
            padding: 16px 16px 16px 60px;
            border: none;
            background: rgba(0, 0, 0, 0.8);
            color: #00ffcc;
            border-bottom: 1px solid rgba(255, 0, 128, 0.3);
        }
        
        .new-todo::placeholder {
            color: rgba(0, 255, 204, 0.3);
            font-style: italic;
        }
        
        .new-todo:focus {
            outline: none;
            background: rgba(255, 0, 128, 0.05);
            box-shadow: inset 0 0 20px rgba(255, 0, 128, 0.2);
        }
        
        .main {
            position: relative;
            z-index: 2;
            border-top: 1px solid rgba(255, 0, 128, 0.2);
        }
        
        .toggle-all {
            position: absolute;
            top: 20px;
            left: 15px;
            width: 30px;
            height: 30px;
            opacity: 0;
            cursor: pointer;
            z-index: 3;
        }
        
        .toggle-all + label {
            position: absolute;
            left: 15px;
            top: 20px;
            width: 30px;
            height: 30px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00ffcc;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .toggle-all:checked + label {
            background: #ff0080;
            border-color: #ff0080;
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.5);
        }
        
        .toggle-all + label::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #000;
            font-size: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .toggle-all:checked + label::after {
            opacity: 1;
        }
        
        .todo-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        
        .todo-list li {
            position: relative;
            font-size: 20px;
            border-bottom: 1px solid rgba(255, 0, 128, 0.2);
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }
        
        .todo-list li:hover {
            background: rgba(255, 0, 128, 0.05);
        }
        
        .todo-list li .view {
            display: flex;
            align-items: center;
            padding: 15px 15px 15px 60px;
        }
        
        .todo-list li .toggle {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            opacity: 0;
            cursor: pointer;
        }
        
        .todo-list li .toggle + label {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00ffcc;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .todo-list li .toggle:checked + label {
            background: #00ffcc;
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }
        
        .todo-list li label {
            flex: 1;
            color: #00ffcc;
            transition: all 0.3s;
            word-break: break-word;
        }
        
        .todo-list li.completed label {
            color: rgba(0, 255, 204, 0.3);
            text-decoration: line-through;
        }
        
        .todo-list li .destroy {
            display: none;
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            font-size: 24px;
            color: #ff0080;
            background: transparent;
            border: 2px solid #ff0080;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .todo-list li:hover .destroy {
            display: block;
        }
        
        .todo-list li .destroy:hover {
            background: #ff0080;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.7);
        }
        
        .todo-list li .destroy::after {
            content: '✕';
        }
        
        .footer {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid rgba(255, 0, 128, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', monospace;
            font-size: 14px;
        }
        
        .todo-count {
            color: #00ffcc;
        }
        
        .todo-count strong {
            font-weight: 700;
            color: #ff0080;
        }
        
        .filters {
            display: flex;
            gap: 10px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .filters a {
            color: #00ffcc;
            text-decoration: none;
            padding: 5px 10px;
            border: 1px solid transparent;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .filters a:hover {
            border-color: #ff0080;
        }
        
        .filters a.selected {
            border-color: #ff0080;
            background: rgba(255, 0, 128, 0.2);
            box-shadow: 0 0 10px rgba(255, 0, 128, 0.5);
        }
        
        .clear-completed {
            background: transparent;
            color: #ff0080;
            border: 1px solid #ff0080;
            padding: 5px 10px;
            cursor: pointer;
            font-family: 'Orbitron', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        
        .clear-completed:hover {
            background: #ff0080;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.7);
        }
        
        /* Time Travel Panel */
        .time-travel-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: rgba(10, 10, 30, 0.95);
            border: 2px solid #ff0080;
            padding: 15px;
            box-shadow: 0 0 30px rgba(255, 0, 128, 0.5);
            z-index: 1000;
            transition: all 0.3s;
        }
        
        .time-travel-panel.collapsed {
            width: 60px;
            height: 60px;
            padding: 0;
            overflow: hidden;
        }
        
        .time-travel-toggle {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #ff0080, #00ffcc);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s;
            position: absolute;
            top: 0;
            right: 0;
            z-index: 1;
        }
        
        .time-travel-panel.collapsed .time-travel-toggle {
            position: static;
            width: 100%;
            height: 100%;
        }
        
        .time-travel-toggle:hover {
            transform: rotate(180deg);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }
        
        .time-travel-content {
            display: block;
            margin-top: 70px;
        }
        
        .time-travel-panel.collapsed .time-travel-content {
            display: none;
        }
        
        .time-travel-header {
            font-family: 'Orbitron', monospace;
            color: #ff0080;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .time-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .time-btn {
            flex: 1;
            padding: 8px;
            background: transparent;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .time-btn:hover:not(:disabled) {
            background: rgba(0, 255, 204, 0.1);
            border-color: #ff0080;
            color: #ff0080;
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.5);
        }
        
        .time-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .checkpoint-controls {
            display: flex;
            gap: 5px;
        }
        
        .checkpoint-controls input {
            flex: 1;
            padding: 5px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            font-family: 'Rajdhani', sans-serif;
            font-size: 12px;
        }
        
        .checkpoint-btn {
            padding: 5px 10px;
            background: linear-gradient(45deg, #ff0080, #ff0040);
            color: #000;
            border: none;
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .checkpoint-btn:hover {
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.7);
        }
    </style>
</head>
<body>
    <div id="app">
        <div style="text-align: center; padding: 100px; font-family: 'Orbitron', monospace;">
            <h2 style="color: #ff0080;">[ REACTOR INITIALIZING ]</h2>
            <p style="color: #00ffcc;">COMPILING REACTIVE STREAMS...</p>
        </div>
    </div>
    <script src="/js/main.js"></script>
</body>
</html>
