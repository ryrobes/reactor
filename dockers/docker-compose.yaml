version: '3.8'

services:
  kafka:
    image: bitnami/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=1
      - KAFKA_CFG_MESSAGE_TIMESTAMP_TYPE=LogAppendTime
      - KAFKA_CFG_LOG_RETENTION_MS=604800000
      - KAFKA_CFG_MESSAGE_MAX_BYTES=1048576
      - KAFKA_CFG_LOG_CLEANUP_POLICY=delete
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  xtdb:
    image: ghcr.io/xtdb/xtdb-aws:2.0.0
    container_name: xtdb
    ports:
      - "8080:8080"
      - "5432:5432"
    volumes:
      - ./xtdb-config.yaml:/etc/xtdb/config.yaml
      - xtdb_data:/var/lib/xtdb
    command: -f /etc/xtdb/config.yaml
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - XTDB_ENABLE_PGWIRE_SERVER=true
      - XTDB_PGWIRE_PORT=5432  # Explicitly set to match exposed port
      - XTDB_ENABLE_HTTP_SERVER=true  # Enable HTTP for healthcheck
      - XTDB_HTTP_SERVER_PORT=8080  # Explicit port for HTTP
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz/alive"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  kafka_data:
  xtdb_data: